<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btnShow">Ajouter Categorie</button>
    <form id="form" hidden>
        <input type="text" id="nom" placeholder="Categorie-nom">
        <input type="text" id="couleur" placeholder="Categorie-couleur">
        <button id="btnAdd" type="submit">Ajouter</button>
        <button id="btnCancel" type="submit">Annuler</button>
    </form>
    <table border="1" id="table">
        <tr>
            <th>Nom</th>
            <th>Couleur</th>
        </tr>
    </table>
    <script src="script.js"></script>
</body>
</html>
