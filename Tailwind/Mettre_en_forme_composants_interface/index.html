<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des catégories</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-gray-800 text-white">
            <nav class="flex flex-col gap-2 p-4">
                <a href="#" class="text-gray-300 hover:bg-gray-700 p-3 rounded-lg">Tableau de bord</a>
                <a href="#" class="text-gray-300 hover:bg-gray-700 p-3 rounded-lg">Articles</a>
                <a href="#" class="bg-blue-600 text-white p-3 rounded-lg">Catégories</a>
            </nav>
        </aside>
        <div class="flex-1 flex flex-col">
            <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
                <h1 class="text-lg font-semibold text-gray-800">Gestion des catégories</h1>
                <span class="text-sm text-gray-500">Admin</span>
            </header>
            <main class="flex-1 p-6">
                <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow">
                    <h2 class="text-xl font-semibold text-gray-800 mb-6">Ajouter une catégorie</h2>
                    <form action="#"class="space-y-4">
                        <div>
                            <label for="nom" class="block text-sm font-medium text-gray-700 mb-1">Nom de la catégorie</label>
                            <input type="text" id="nom" name="nom" placeholder="Ex: Technologie" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="flex gap-3 pt-2">
                            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Ajouter</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
